<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Jeu à Boire</title>
    <link rel="stylesheet" href="style.css" />
</head>
<body>

<div id="screen-home">
    <h1>🍺 Jeu à Boire</h1>

    <div id="players-section">
        <h2>Joueurs</h2>
        <input type="text" id="player-input" placeholder="Prénom du joueur..." />
        <button id="btn-add-player">Ajouter</button>
        <ul id="players-list"></ul>
    </div>

    <div id="game-selection" class="hidden">
        <h2>Mode de jeu</h2>
        <select id="game-selector">
            <option value="cercle">Le Cercle (Défis & TOZ)</option>
            <option value="jnj">Je n'ai jamais (Hot)</option>
            <option value="7sec">Les 7 Secondes</option>
            <option value="palmier">Le Palmier</option>
            <option value="picolo">Picolo (Chaos absolu)</option>
        </select>
        <br>
        <button id="btn-start">🎮 Lancer la partie !</button>
    </div>
</div>

<div id="screen-game" class="hidden">
    <h2 id="game-name">Nom du jeu</h2>

    <div id="timer-display" class="hidden">7</div>

    <div id="game-card">
        <p id="game-text">Le texte apparaît ici...</p>
    </div>

    <div id="game-actions">
        <button id="btn-next">➡️ Suivant</button>
        <button id="btn-quit">🚪 Quitter</button>
    </div>
</div>

<div id="screen-end" class="hidden">
    <h2>🎉 Fin de la partie !</h2>
    <p>Il n'y a plus de questions. Buvez un grand verre d'eau et allez dormir.</p>
    <button id="btn-restart">🔄 Rejouer</button>
</div>

<script src="script.js"></script>
</body>
</html>
